---
- name: Get helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
    dest: /tmp/get_helm.sh
    mode: '0700'
  become: true

- name: Check if Helm is installed
  ansible.builtin.command: helm version
  ignore_errors: true
  changed_when: false
  register: helm_version

- name: Install helm
  ansible.builtin.command: /tmp/get_helm.sh
  become: true
  when: helm_version.rc != 0

- name: Download metrics-server manifest to the cluster.
  ansible.builtin.get_url:
    url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    dest: ~/metrics-server.yaml
    mode: '0664'

- name: Apply metrics-server manifest to the cluster
  ansible.builtin.command: kubectl apply -f ~/metrics-server.yaml
  environment:
    KUBECONFIG: /home/flor/.kube/config
  register: metrics_apply
  changed_when: "'configured' in metrics_apply.stdout or 'created' in metrics_apply.stdout"

- name: Check if metrics-server patch is already applied
  ansible.builtin.command: >
    kubectl get deployment metrics-server
    -n kube-system
    -o jsonpath='{.spec.template.spec.containers[0].args}'
  register: metrics_args
  changed_when: false
  environment:
    KUBECONFIG: /home/flor/.kube/config

- name: Patch metrics-server to allow insecure TLS
  ansible.builtin.command: >
    kubectl patch deployment metrics-server
    -n kube-system
    --type='json'
    -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
  when: "'--kubelet-insecure-tls' not in metrics_args.stdout"
  environment:
    KUBECONFIG: /home/flor/.kube/config